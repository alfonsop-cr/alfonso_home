name: Actualizar MONEX

on:
  schedule:
    # 13:15 Costa Rica (UTC-6) lun-vie, después de la sesión 12:00-13:00
    - cron: "15 19 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Leer cuadro 770 del BCCR
        run: python scripts/update_monex.py
      - name: Publicar monex.json si cambió
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add monex.json
          if git diff --staged --quiet; then
            echo "Sin cambios"
          else
            git commit -m "Update official MONEX session from BCCR cuadro 770"
            git push
          fi
