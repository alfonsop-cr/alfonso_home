<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alfonso</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,560&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: "IBM Plex Sans", sans-serif;
            background: #121820;
            color: #f3f1ea;
            margin: 0;
            min-height: 100vh;
        }
        a { color: #8ec8e8; }
        .page {
            max-width: 1080px;
            margin: 0 auto;
            padding: 32px 28px 72px;
            min-width: 0;
        }
        .masthead {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            border-bottom: 1px solid #f3f1ea22;
            padding-bottom: 20px;
            margin-bottom: 32px;
        }
        .masthead h1 {
            font-family: Fraunces, serif;
            font-size: 42px;
            font-weight: 560;
            margin: 0;
            line-height: 1.1;
            color: #f3f1ea;
        }
        .masthead .place {
            margin: 6px 0 0;
            font-size: 13px;
            color: #9aa3ad;
        }
        .masthead-right { text-align: right; }
        #fecha-cr {
            font-size: 13px;
            color: #9aa3ad;
        }
        #hora-cr {
            font-size: 28px;
            font-weight: 500;
            font-variant-numeric: tabular-nums;
            line-height: 1.2;
            color: #f3f1ea;
        }
        .ahora {
            display: grid;
            grid-template-columns: 260px 1fr;
            gap: 32px;
            margin-bottom: 40px;
            min-width: 0;
        }
        .news {
            --bg: #121820;
            --text: #f3f1ea;
            --muted: #9aa3ad;
            --line: rgba(243,241,234,0.12);
            --accent: #e8b86d;
            min-width: 0;
        }
        .tablist {
            display: flex;
            gap: 28px;
            align-items: flex-end;
            padding: 0 0 14px;
            border-bottom: 1px solid var(--line);
            overflow-x: auto;
            overflow-y: visible;
            scrollbar-width: thin;
        }
        .tab {
            background: none;
            border: 0;
            padding: 0 0 10px;
            font-family: "IBM Plex Sans", sans-serif;
            font-size: 14px;
            font-weight: 500;
            color: var(--muted);
            white-space: nowrap;
            flex: 0 0 auto;
            position: relative;
            cursor: pointer;
            border-radius: 0;
        }
        .tab[aria-selected="true"] {
            color: var(--text);
            font-weight: 600;
        }
        .tab[aria-selected="true"]::after {
            content: "";
            position: absolute;
            left: 50%;
            bottom: -1px;
            transform: translateX(-50%);
            border-left: 7px solid transparent;
            border-right: 7px solid transparent;
            border-top: 7px solid #e8b86d;
        }
        .tab:hover {
            color: var(--text);
        }
        .news-panel {
            min-width: 0;
            padding-top: 20px;
        }
        .news-empty {
            color: var(--muted);
            font-size: 13px;
            margin: 0;
        }
        .vistas-toggle {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            margin: 0 0 16px;
            padding: 0;
            background: none;
            border: 0;
            color: var(--muted);
            font-family: "IBM Plex Sans", sans-serif;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
        }
        .vistas-toggle[aria-checked="true"] { color: var(--text); }
        .vistas-track {
            position: relative;
            width: 32px;
            height: 18px;
            flex: 0 0 auto;
            border-radius: 999px;
            background: #1a2330;
            border: 1px solid var(--line);
        }
        .vistas-knob {
            position: absolute;
            top: 1px;
            left: 1px;
            width: 14px;
            height: 14px;
            border-radius: 50%;
            background: var(--muted);
            transition: transform 0.15s ease;
        }
        .vistas-toggle[aria-checked="true"] .vistas-track {
            border-color: #e8b86d66;
        }
        .vistas-toggle[aria-checked="true"] .vistas-knob {
            transform: translateX(14px);
            background: var(--accent);
        }
        @media (max-width: 800px) {
            .ahora { grid-template-columns: 1fr; }
            .masthead {
                flex-direction: column;
                align-items: flex-start;
                gap: 12px;
            }
            .masthead-right { text-align: left; }
        }
        @media (max-width: 430px) {
            .page { padding: 20px 16px 48px; }
            .masthead h1 { font-size: 32px; }
            #hora-cr { font-size: 24px; }
            .monex .rate { font-size: 32px; }
            .hecho h3 { font-size: 16px; }
            .fuentes { overflow-wrap: anywhere; }
        }
        .fx-panel {
            background: #1a2330;
            border-radius: 12px;
            padding: 20px 22px;
        }
        .monex { text-align: left; }
        .monex .eyebrow {
            font-size: 11px;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: #9aa3ad;
        }
        .monex .rate {
            font-size: 36px;
            font-weight: 500;
            color: #e8b86d;
            margin: 6px 0 2px;
            font-variant-numeric: tabular-nums;
        }
        .monex .rate-caption {
            font-size: 13px;
            color: #9aa3ad;
        }
        .monex .bac-rates {
            display: flex;
            justify-content: flex-start;
            gap: 28px;
            margin-top: 14px;
            font-size: 13px;
            flex-wrap: nowrap;
        }
        .monex .bac-rates span {
            color: #9aa3ad;
            font-size: 11px;
            display: block;
        }
        .monex .bac-note,
        .monex .session,
        .monex .fuente {
            margin-top: 8px;
            font-size: 11px;
            color: #9aa3ad;
        }
        .monex .bac-note { margin-top: 6px; }
        .monex .session { margin-top: 10px; }
        .monex a { color: #8ec8e8; text-decoration: none; }
        .weather {
            min-width: 0;
        }
        .weather-title {
            margin: 0 0 4px;
            font-family: "IBM Plex Sans", sans-serif;
            font-size: 13px;
            font-weight: 500;
            color: #9aa3ad;
        }
        #now-meta {
            margin: 0 0 16px;
            font-size: 13px;
            color: #9aa3ad;
        }
        .timeline {
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            gap: 4px;
            overflow: visible;
            padding: 4px 0 12px;
        }
        .hour-slot {
            min-width: 0;
            text-align: center;
            opacity: 0.72;
            padding: 4px 2px 8px;
        }
        .hour-slot.current {
            opacity: 1;
            border-bottom: 2px solid #e8b86d;
        }
        .hour-slot .time {
            font-size: 12px;
            color: #9aa3ad;
            display: block;
        }
        .hour-slot .ahora-label,
        .hour-slot .manana-label {
            font-size: 11px;
            color: #9aa3ad;
            display: block;
        }
        .hour-slot .weather-icon {
            font-size: 1.35rem;
            margin: 6px 0;
            display: block;
            color: #e8b86d;
        }
        .hour-slot .temp {
            font-size: 17px;
            font-weight: 600;
            display: block;
        }
        .rain-chance {
            color: #7eb8d4;
            font-size: 11px;
            min-height: 14px;
            margin-top: 4px;
        }
        .news-subheading {
            margin: 22px 0 8px;
            font-size: 1.05rem;
            font-weight: 500;
        }
        .hecho {
            padding: 18px 0;
            border-top: 1px solid #f3f1ea22;
        }
        .hecho:first-child { border-top: none; padding-top: 0; }
        .hecho h3 {
            margin: 0 0 10px;
            font-size: 1.05rem;
            font-weight: 500;
            line-height: 1.35;
        }
        .hecho-meta {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            margin: -6px 0 10px;
            min-width: 0;
        }
        .hecho-meta .hora-agregado { margin: 0; }
        .hora-agregado {
            font-size: 12px;
            line-height: 1.4;
            color: var(--muted);
            font-variant-numeric: tabular-nums;
        }
        .visto-btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            margin-left: auto;
            padding: 0;
            background: none;
            border: 0;
            color: var(--muted);
            font-family: "IBM Plex Sans", sans-serif;
            font-size: 12px;
            font-weight: 500;
            line-height: 1.4;
            white-space: nowrap;
            cursor: pointer;
        }
        .visto-btn:hover { color: var(--text); }
        .visto-mark {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            border: 1px solid currentColor;
            flex: 0 0 auto;
        }
        .visto-btn[aria-pressed="true"] { color: var(--accent); }
        .visto-btn[aria-pressed="true"] .visto-mark {
            background: var(--accent);
            border-color: var(--accent);
        }
        .hecho.is-visto h3 { color: var(--muted); }
        .hecho p {
            margin: 0 0 8px;
            font-size: 0.92rem;
            line-height: 1.5;
            color: #f3f1ea;
        }
        .hecho p:last-of-type { margin-bottom: 12px; }
        .fuentes {
            font-size: 12px;
            line-height: 1.5;
        }
        .fuentes a {
            color: #8ec8e8;
            text-decoration: none;
            background: none;
            border: none;
            border-radius: 0;
            padding: 0;
        }
        .fuentes a + a::before {
            content: " · ";
            color: #9aa3ad;
        }
        #loader { color: #9aa3ad; }
    </style>
</head>
<body>
<div class="page">
    <header class="masthead">
        <div class="masthead-left">
            <h1>Alfonso</h1>
            <p class="place">San Antonio de Belén</p>
        </div>
        <div class="masthead-right">
            <div id="fecha-cr"></div>
            <div id="hora-cr"></div>
        </div>
    </header>
    <div class="ahora">
        <div class="fx-panel">
            <div class="monex" id="monex">
                <div class="eyebrow">USD/CRC</div>
                <div class="rate" id="monex-rate">…</div>
                <div class="rate-caption">Promedio ponderado · MONEX</div>
                <div class="bac-rates">
                    <div><span>Compra BAC</span><strong id="bac-compra">—</strong></div>
                    <div><span>Venta BAC</span><strong id="bac-venta">—</strong></div>
                </div>
                <div class="bac-note">Ventanilla <a id="bac-fuente" href="https://gee.bccr.fi.cr/IndicadoresEconomicos/Cuadros/frmConsultaTCVentanilla.aspx" target="_blank" rel="noopener">BAC San José</a></div>
                <div class="session" id="monex-session"></div>
                <div class="fuente">Fuente MONEX: <a id="monex-fuente" href="https://gee.bccr.fi.cr/indicadoreseconomicos/Cuadros/frmVerCatCuadro.aspx?CodCuadro=770&idioma=1" target="_blank" rel="noopener">BCCR / MONEX</a></div>
            </div>
        </div>
        <div class="weather">
            <h2 class="weather-title">Belén · 24 h</h2>
            <div id="now-meta"></div>
            <div id="loader">Cargando pronóstico...</div>
            <div id="forecast" class="timeline"></div>
        </div>
    </div>
    <div class="news">
        <div class="tablist" role="tablist" aria-label="Noticias">
            <button type="button" class="tab" role="tab" id="tab-cr" aria-controls="panel-cr" aria-selected="true" tabindex="0">Costa Rica News</button>
            <button type="button" class="tab" role="tab" id="tab-ai" aria-controls="panel-ai" aria-selected="false" tabindex="-1">AI News</button>
            <button type="button" class="tab" role="tab" id="tab-us" aria-controls="panel-us" aria-selected="false" tabindex="-1">US News</button>
            <button type="button" class="tab" role="tab" id="tab-world" aria-controls="panel-world" aria-selected="false" tabindex="-1">World News</button>
        </div>
        <div class="news-panel">
            <button type="button" class="vistas-toggle" id="vistas-toggle" role="switch" aria-checked="false">
                <span class="vistas-track" aria-hidden="true"><span class="vistas-knob"></span></span>
                <span>Mostrar vistas</span>
            </button>
            <div id="panel-cr" role="tabpanel" aria-labelledby="tab-cr">
                <div id="noticias"></div>
            </div>
            <div id="panel-ai" role="tabpanel" aria-labelledby="tab-ai" hidden>
                <div id="leo-hechos"></div>
                <h3 class="news-subheading">Columnas / análisis</h3>
                <div id="leo-columnas"></div>
            </div>
            <div id="panel-us" role="tabpanel" aria-labelledby="tab-us" hidden>
                <div id="us-hechos"></div>
            </div>
            <div id="panel-world" role="tabpanel" aria-labelledby="tab-world" hidden>
                <div id="world-hechos"></div>
            </div>
        </div>
    </div>
</div>
<script>
    function getWeatherIcon(code, rain) {
        if (code >= 95 && code <= 99) return 'bi-cloud-lightning-rain';
        if (code >= 45 && code <= 48 && rain < 40) return 'bi-cloud-fog';
        if (rain >= 60) return 'bi-cloud-rain-heavy';
        if (rain >= 40) return 'bi-cloud-rain';
        if (rain >= 20) return 'bi-cloud-drizzle';
        if (code === 0) return 'bi-sun';
        if (code >= 1 && code <= 3) return 'bi-cloud-sun';
        return 'bi-cloud';
    }
    function colon(n) {
        return '₡' + Number(n).toFixed(2).replace('.', ',');
    }
    function jsonUrl(path) {
        return path + '?t=' + Date.now();
    }
    function updateClock() {
        const now = new Date();
        const opts = { timeZone: 'America/Costa_Rica' };
        document.getElementById('fecha-cr').textContent = now.toLocaleDateString('es-CR', Object.assign({
            weekday: 'long',
            day: 'numeric',
            month: 'long',
            year: 'numeric'
        }, opts)).replace(',', '');
        document.getElementById('hora-cr').textContent = now.toLocaleTimeString('es-CR', Object.assign({
            hour: '2-digit',
            minute: '2-digit',
            hour12: false
        }, opts));
    }
    async function fetchWeather() {
        const lat = 9.9781;
        const lon = -84.1879;
        const url = 'https://api.open-meteo.com/v1/forecast?latitude=' + lat + '&longitude=' + lon + '&hourly=temperature_2m,relative_humidity_2m,precipitation_probability,weather_code,wind_speed_10m&timezone=America%2FCosta_Rica&forecast_days=3';
        try {
            const response = await fetch(url);
            const data = await response.json();
            renderForecast(data.hourly);
        } catch (error) {
            document.getElementById('loader').innerText = 'Error al obtener datos.';
        }
    }
    function renderForecast(hourly) {
        const container = document.getElementById('forecast');
        const loader = document.getElementById('loader');
        loader.style.display = 'none';
        const now = new Date();
        let startIndex = hourly.time.findIndex(t => new Date(t) > now);
        if (startIndex === -1) startIndex = Math.max(0, hourly.time.length - 25);
        else startIndex = Math.max(0, startIndex - 1);
        if (startIndex + 24 >= hourly.time.length) {
            startIndex = Math.max(0, hourly.time.length - 25);
        }
        const nowHum = hourly.relative_humidity_2m[startIndex];
        const nowWind = hourly.wind_speed_10m[startIndex];
        document.getElementById('now-meta').textContent = nowHum + '% humedad · ' + nowWind + ' km/h';
        const offsets = [0, 3, 6, 12, 18, 24];
        offsets.forEach(function (offset, n) {
            const i = startIndex + offset;
            if (i >= hourly.time.length) return;
            const date = new Date(hourly.time[i]);
            let hourLabel = new Intl.DateTimeFormat('es-CR', { timeZone: 'America/Costa_Rica', hour: '2-digit', hour12: false }).format(date);
            if (hourLabel.indexOf(':') === -1) hourLabel = hourLabel.replace(/\D/g, '') + ':00';
            const temp = Math.round(hourly.temperature_2m[i]);
            const rain = hourly.precipitation_probability[i];
            const code = hourly.weather_code[i];
            const isCurrent = (n === 0);
            const slot = document.createElement('div');
            slot.className = isCurrent ? 'hour-slot current' : 'hour-slot';
            let html = '<span class="time">' + hourLabel + '</span>';
            if (isCurrent) html += '<span class="ahora-label">ahora</span>';
            else if (offset === 24) html += '<span class="manana-label">mañana</span>';
            html += '<i class="bi ' + getWeatherIcon(code, rain) + ' weather-icon"></i>' +
                '<span class="temp">' + temp + '°C</span>';
            if (rain >= 40) {
                html += '<div class="rain-chance">' + rain + '%</div>';
            } else {
                html += '<div class="rain-chance"></div>';
            }
            slot.innerHTML = html;
            container.appendChild(slot);
        });
    }
    async function fetchMonex() {
        try {
            const res = await fetch(jsonUrl('./monex.json'), { cache: 'no-store' });
            if (!res.ok) throw new Error('monex.json');
            const d = await res.json();
            document.getElementById('monex-rate').textContent = colon(d.promedioPonderado);
            document.getElementById('monex-session').textContent = 'Sesión MONEX ' + (d.fechaTexto || d.fecha);
            if (d.fuenteUrl) document.getElementById('monex-fuente').href = d.fuenteUrl;
        } catch (e) {
            document.getElementById('monex-rate').textContent = 'No disponible';
            document.getElementById('monex-session').textContent = 'No se pudo leer el dato oficial';
        }
    }
    async function fetchBac() {
        try {
            const res = await fetch(jsonUrl('./bac.json'), { cache: 'no-store' });
            if (!res.ok) throw new Error('bac.json');
            const d = await res.json();
            document.getElementById('bac-compra').textContent = colon(d.compra);
            document.getElementById('bac-venta').textContent = colon(d.venta);
            if (d.fuenteUrl) document.getElementById('bac-fuente').href = d.fuenteUrl;
        } catch (e) {
            document.getElementById('bac-compra').textContent = '—';
            document.getElementById('bac-venta').textContent = '—';
        }
    }
    function escapeHtml(s) {
        return String(s)
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;')
            .replace(/'/g, '&#39;');
    }
    function parseAgregadoMs(value) {
        if (!value) return NaN;
        return Date.parse(value);
    }
    function formatHoraAgregado(value) {
        const ms = parseAgregadoMs(value);
        if (isNaN(ms)) return '';
        return new Date(ms).toLocaleTimeString('es-CR', {
            timeZone: 'America/Costa_Rica',
            hour: '2-digit',
            minute: '2-digit',
            hour12: false
        });
    }
    function sortHechos(items) {
        return items.slice().sort(function (a, b) {
            const ta = parseAgregadoMs(a && a.agregado);
            const tb = parseAgregadoMs(b && b.agregado);
            const aOk = !isNaN(ta);
            const bOk = !isNaN(tb);
            if (aOk && bOk) return tb - ta;
            if (aOk) return -1;
            if (bOk) return 1;
            return 0;
        });
    }
    var NEWS_WINDOW_MS = 24 * 60 * 60 * 1000;
    function isWithinLast24h(item) {
        const ms = parseAgregadoMs(item && item.agregado);
        if (isNaN(ms)) return false;
        return Date.now() - ms <= NEWS_WINDOW_MS;
    }
    function filterLast24h(items, keepIfMissing) {
        return (items || []).filter(function (item) {
            const ms = parseAgregadoMs(item && item.agregado);
            if (isNaN(ms)) return !!keepIfMissing;
            return isWithinLast24h(item);
        });
    }
    var SEEN_STORAGE_KEY = 'alfonso.news.seen';
    var SEEN_TAB_IDS = ['cr', 'ai', 'us', 'world'];
    var newsCache = {};
    var seenState = null;
    function emptyTabSeen() {
        return { showVistas: false, titulos: [], urls: [] };
    }
    function loadSeenState() {
        var fresh = {
            cr: emptyTabSeen(),
            ai: emptyTabSeen(),
            us: emptyTabSeen(),
            world: emptyTabSeen()
        };
        try {
            var raw = localStorage.getItem(SEEN_STORAGE_KEY);
            if (!raw) return fresh;
            var parsed = JSON.parse(raw);
            SEEN_TAB_IDS.forEach(function (id) {
                var tab = parsed && parsed[id];
                if (!tab) return;
                fresh[id].showVistas = !!tab.showVistas;
                fresh[id].titulos = Array.isArray(tab.titulos) ? tab.titulos.filter(function (x) { return typeof x === 'string'; }) : [];
                fresh[id].urls = Array.isArray(tab.urls) ? tab.urls.filter(function (x) { return typeof x === 'string'; }) : [];
            });
        } catch (e) {}
        return fresh;
    }
    function getSeenState() {
        if (!seenState) seenState = loadSeenState();
        return seenState;
    }
    function saveSeenState() {
        try {
            localStorage.setItem(SEEN_STORAGE_KEY, JSON.stringify(getSeenState()));
        } catch (e) {}
    }
    function hechoTitulo(hecho) {
        return hecho && hecho.titulo != null ? String(hecho.titulo) : '';
    }
    function hechoFuenteUrl(hecho) {
        var f0 = hecho && hecho.fuentes && hecho.fuentes[0];
        return f0 && f0.url ? String(f0.url) : '';
    }
    function isHechoSeen(tabId, hecho) {
        var tab = getSeenState()[tabId];
        if (!tab) return false;
        var titulo = hechoTitulo(hecho);
        if (titulo && tab.titulos.indexOf(titulo) !== -1) return true;
        var url = hechoFuenteUrl(hecho);
        return !!(url && tab.urls.indexOf(url) !== -1);
    }
    function setHechoSeen(tabId, hecho, seen) {
        var tab = getSeenState()[tabId];
        if (!tab) return;
        var titulo = hechoTitulo(hecho);
        var url = hechoFuenteUrl(hecho);
        function add(list, value) {
            if (value && list.indexOf(value) === -1) list.push(value);
        }
        function remove(list, value) {
            var i = list.indexOf(value);
            if (i !== -1) list.splice(i, 1);
        }
        if (seen) {
            add(tab.titulos, titulo);
            add(tab.urls, url);
        } else {
            remove(tab.titulos, titulo);
            remove(tab.urls, url);
        }
        saveSeenState();
    }
    function visibleHechos(tabId, items) {
        if (getSeenState()[tabId] && getSeenState()[tabId].showVistas) return items;
        return (items || []).filter(function (item) { return !isHechoSeen(tabId, item); });
    }
    function renderHechos(container, items, tabId) {
        container.replaceChildren();
        if (!items || !items.length) {
            const empty = document.createElement('p');
            empty.className = 'news-empty';
            empty.textContent = 'Todavía no hay briefing.';
            container.appendChild(empty);
            return;
        }
        const shown = visibleHechos(tabId, items);
        if (!shown.length) {
            const empty = document.createElement('p');
            empty.className = 'news-empty';
            empty.textContent = 'No hay hechos sin marcar.';
            container.appendChild(empty);
            return;
        }
        sortHechos(shown).forEach(function (hecho) {
            const seen = isHechoSeen(tabId, hecho);
            const article = document.createElement('article');
            article.className = seen ? 'hecho is-visto' : 'hecho';
            let html = '<h3>' + escapeHtml(hecho.titulo) + '</h3>';
            html += '<div class="hecho-meta">';
            const hora = formatHoraAgregado(hecho.agregado);
            if (hora) {
                html += '<div class="hora-agregado"><time datetime="' + escapeHtml(hecho.agregado) + '">' + escapeHtml(hora) + '</time></div>';
            }
            html += '<button type="button" class="visto-btn" aria-pressed="' + (seen ? 'true' : 'false') + '" data-tab="' + escapeHtml(tabId) + '" data-titulo="' + escapeHtml(hechoTitulo(hecho)) + '" data-url="' + escapeHtml(hechoFuenteUrl(hecho)) + '"><span class="visto-mark" aria-hidden="true"></span>ya la vi</button>';
            html += '</div>';
            const paras = (hecho.resumen || []).slice(0, 2);
            paras.forEach(function (p) {
                html += '<p>' + escapeHtml(p) + '</p>';
            });
            if (hecho.fuentes && hecho.fuentes.length) {
                html += '<div class="fuentes">';
                hecho.fuentes.forEach(function (f) {
                    html += '<a href="' + escapeHtml(f.url) + '" target="_blank" rel="noopener">' + escapeHtml(f.medio) + '</a>';
                });
                html += '</div>';
            }
            article.innerHTML = html;
            container.appendChild(article);
        });
    }
    function cacheAndRender(tabId, containerId, items) {
        if (!newsCache[tabId]) newsCache[tabId] = {};
        newsCache[tabId][containerId] = items;
        renderHechos(document.getElementById(containerId), items, tabId);
    }
    function rerenderTab(tabId) {
        const cached = newsCache[tabId];
        if (!cached) return;
        Object.keys(cached).forEach(function (containerId) {
            renderHechos(document.getElementById(containerId), cached[containerId], tabId);
        });
    }
    function syncVistasToggle(tabId) {
        const btn = document.getElementById('vistas-toggle');
        const on = !!(getSeenState()[tabId] && getSeenState()[tabId].showVistas);
        btn.setAttribute('aria-checked', on ? 'true' : 'false');
    }
    async function fetchNoticias() {
        try {
            const res = await fetch(jsonUrl('https://gist.githubusercontent.com/alfonsop-cr/d2fbaafff3792aad2dc64ae37d9db88d/raw/noticias.json'), { cache: 'no-store' });
            if (!res.ok) throw new Error('noticias.json');
            const d = await res.json();
            cacheAndRender('cr', 'noticias', filterLast24h(d.hechos));
        } catch (e) {
            document.getElementById('noticias').textContent = 'No se pudieron cargar las noticias.';
        }
    }
    async function fetchLeo() {
        try {
            const res = await fetch(jsonUrl('https://gist.githubusercontent.com/alfonsop-cr/d2fbaafff3792aad2dc64ae37d9db88d/raw/leo.json'), { cache: 'no-store' });
            if (!res.ok) throw new Error('leo.json');
            const d = await res.json();
            cacheAndRender('ai', 'leo-hechos', filterLast24h(d.hechos));
            cacheAndRender('ai', 'leo-columnas', filterLast24h(d.columnas, true));
        } catch (e) {
            document.getElementById('leo-hechos').textContent = 'No se pudieron cargar las noticias.';
        }
    }
    async function fetchFeed(path, targetId, tabId) {
        try {
            const res = await fetch(jsonUrl(path), { cache: 'no-store' });
            if (!res.ok) throw new Error(path);
            const d = await res.json();
            cacheAndRender(tabId, targetId, filterLast24h(d.hechos));
        } catch (e) {
            document.getElementById(targetId).textContent = 'No se pudieron cargar las noticias.';
        }
    }
    function loadTab(id) {
        if (id === 'cr') fetchNoticias();
        else if (id === 'ai') fetchLeo();
        else if (id === 'us') fetchFeed('https://gist.githubusercontent.com/alfonsop-cr/d2fbaafff3792aad2dc64ae37d9db88d/raw/us.json', 'us-hechos', 'us');
        else if (id === 'world') fetchFeed('https://gist.githubusercontent.com/alfonsop-cr/d2fbaafff3792aad2dc64ae37d9db88d/raw/world.json', 'world-hechos', 'world');
    }
    function setupNewsTabs() {
        const tabs = Array.prototype.slice.call(document.querySelectorAll('.tab'));
        function selectTab(tab, skipFetch) {
            const panelId = tab.getAttribute('aria-controls');
            const id = panelId.replace('panel-', '');
            tabs.forEach(function (t) {
                const on = (t === tab);
                t.setAttribute('aria-selected', on ? 'true' : 'false');
                t.tabIndex = on ? 0 : -1;
            });
            document.querySelectorAll('[role="tabpanel"]').forEach(function (p) {
                p.hidden = (p.id !== panelId);
            });
            syncVistasToggle(id);
            if (!skipFetch) loadTab(id);
        }
        tabs.forEach(function (tab, i) {
            tab.addEventListener('click', function () { selectTab(tab); });
            tab.addEventListener('keydown', function (e) {
                let next = -1;
                if (e.key === 'ArrowRight') next = (i + 1) % tabs.length;
                else if (e.key === 'ArrowLeft') next = (i - 1 + tabs.length) % tabs.length;
                else if (e.key === 'Home') next = 0;
                else if (e.key === 'End') next = tabs.length - 1;
                if (next === -1) return;
                e.preventDefault();
                selectTab(tabs[next]);
                tabs[next].focus();
            });
        });
        const initial = tabs.filter(function (t) { return t.getAttribute('aria-selected') === 'true'; })[0] || tabs[0];
        if (initial) selectTab(initial);
    }
    function setupVistasControls() {
        document.getElementById('vistas-toggle').addEventListener('click', function () {
            const selected = document.querySelector('.tab[aria-selected="true"]');
            if (!selected) return;
            const tabId = selected.getAttribute('aria-controls').replace('panel-', '');
            const tab = getSeenState()[tabId];
            if (!tab) return;
            tab.showVistas = !tab.showVistas;
            saveSeenState();
            syncVistasToggle(tabId);
            rerenderTab(tabId);
        });
        document.querySelector('.news-panel').addEventListener('click', function (e) {
            const btn = e.target.closest('.visto-btn');
            if (!btn) return;
            const tabId = btn.getAttribute('data-tab');
            const hecho = {
                titulo: btn.getAttribute('data-titulo') || '',
                fuentes: btn.getAttribute('data-url') ? [{ url: btn.getAttribute('data-url') }] : []
            };
            setHechoSeen(tabId, hecho, !isHechoSeen(tabId, hecho));
            rerenderTab(tabId);
        });
    }
    updateClock();
    setInterval(updateClock, 15000);
    setupNewsTabs();
    setupVistasControls();
    fetchWeather();
    fetchMonex();
    fetchBac();
</script>
</body>
