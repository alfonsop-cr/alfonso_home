name: Actualizar clima Belén

on:
  schedule:
    # ~1h cache. Minute 10 UTC avoids the top-of-hour Open-Meteo stampede.
    - cron: "10 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch Open-Meteo → clima.json
        run: python scripts/update_clima.py
      - name: Publicar clima.json si cambió
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add clima.json
          if git diff --staged --quiet; then
            echo "Sin cambios"
          else
            git commit -m "Update Belén clima forecast"
            git push
          fi
