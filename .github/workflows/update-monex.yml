name: Actualizar tipos de cambio

on:
  schedule:
    # 13:15 CR: después de la sesión MONEX
    - cron: "15 19 * * 1-5"
    # 17:45 CR: ventanilla BAC de la tarde
    - cron: "45 23 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Leer MONEX
        id: monex
        continue-on-error: true
        run: python scripts/update_monex.py
      - name: Leer ventanilla BAC
        id: bac
        continue-on-error: true
        run: python scripts/update_bac.py
      - name: Publicar JSON si cambió
        if: always() && (steps.monex.outcome == 'success' || steps.bac.outcome == 'success')
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add monex.json bac.json
          if git diff --staged --quiet; then
            echo "Sin cambios"
          else
            git commit -m "Update official MONEX and BAC ventanilla rates"
            git push
          fi
      - name: Fallar si alguna lectura falló
        if: always()
        run: |
          fail=0
          if [ "${{ steps.monex.outcome }}" != "success" ]; then
            echo "::error::scripts/update_monex.py falló (outcome=${{ steps.monex.outcome }})"
            fail=1
          fi
          if [ "${{ steps.bac.outcome }}" != "success" ]; then
            echo "::error::scripts/update_bac.py falló (outcome=${{ steps.bac.outcome }})"
            fail=1
          fi
          exit "$fail"
