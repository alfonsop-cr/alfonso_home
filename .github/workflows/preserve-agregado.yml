name: Preservar agregado

on:
  push:
    branches: [main]
    paths:
      - noticias.json
      - leo.json
      - us.json
      - world.json
      - scripts/preserve_agregado.py

permissions:
  contents: write

jobs:
  preserve:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Restaurar agregado de hechos que siguen
        run: python scripts/preserve_agregado.py
      - name: Publicar si cambió
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add noticias.json leo.json us.json world.json
          if git diff --staged --quiet; then
            echo "Sin cambios"
          else
            git commit -m "Preserve agregado first-seen timestamps"
            git push
          fi
