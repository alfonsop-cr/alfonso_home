name: Actualizar tipos de cambio

on:
  schedule:
    # 13:15 CR: después de la sesión MONEX
    - cron: "15 19 * * 1-5"
    # 17:45 CR: ventanilla BAC de la tarde
    - cron: "45 23 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Leer MONEX y ventanilla BAC
        run: |
          python scripts/update_monex.py || true
          python scripts/update_bac.py || true
      - name: Publicar JSON si cambió
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add monex.json bac.json
          if git diff --staged --quiet; then
            echo "Sin cambios"
          else
            git commit -m "Update official MONEX and BAC ventanilla rates"
            git push
          fi
