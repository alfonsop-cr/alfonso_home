<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alfonso</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,560&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: "IBM Plex Sans", sans-serif;
            background: #121820;
            color: #f3f1ea;
            margin: 0;
            min-height: 100vh;
        }
        a { color: #8ec8e8; }
        .page {
            max-width: 1080px;
            margin: 0 auto;
            padding: 32px 28px 72px;
        }
        .masthead {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            border-bottom: 1px solid #f3f1ea22;
            padding-bottom: 20px;
            margin-bottom: 32px;
        }
        .masthead h1 {
            font-family: Fraunces, serif;
            font-size: 42px;
            font-weight: 560;
            margin: 0;
            line-height: 1.1;
            color: #f3f1ea;
        }
        .masthead .place {
            margin: 6px 0 0;
            font-size: 13px;
            color: #9aa3ad;
        }
        .masthead-right { text-align: right; }
        #fecha-cr {
            font-size: 13px;
            color: #9aa3ad;
        }
        #hora-cr {
            font-size: 28px;
            font-weight: 500;
            font-variant-numeric: tabular-nums;
            line-height: 1.2;
            color: #f3f1ea;
        }
        .ahora {
            display: grid;
            grid-template-columns: 260px 1fr;
            gap: 32px;
            margin-bottom: 40px;
        }
        .news-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 48px 40px;
        }
        @media (max-width: 800px) {
            .ahora { grid-template-columns: 1fr; }
            .news-row { grid-template-columns: 1fr; }
        }
        .fx-panel {
            background: #1a2330;
            border-radius: 12px;
            padding: 20px 22px;
        }
        .monex { text-align: left; }
        .monex .eyebrow {
            font-size: 11px;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: #9aa3ad;
        }
        .monex .rate {
            font-size: 36px;
            font-weight: 500;
            color: #e8b86d;
            margin: 6px 0 2px;
            font-variant-numeric: tabular-nums;
        }
        .monex .rate-caption {
            font-size: 13px;
            color: #9aa3ad;
        }
        .monex .bac-rates {
            display: flex;
            justify-content: flex-start;
            gap: 28px;
            margin-top: 14px;
            font-size: 13px;
        }
        .monex .bac-rates span {
            color: #9aa3ad;
            font-size: 11px;
            display: block;
        }
        .monex .bac-note,
        .monex .session,
        .monex .fuente {
            margin-top: 8px;
            font-size: 11px;
            color: #9aa3ad;
        }
        .monex .bac-note { margin-top: 6px; }
        .monex .session { margin-top: 10px; }
        .monex a { color: #8ec8e8; text-decoration: none; }
        .weather-title {
            margin: 0 0 16px;
            font-size: 1.15rem;
            font-weight: 500;
        }
        .timeline {
            display: flex;
            overflow-x: auto;
            gap: 4px;
            padding: 4px 0 12px;
            scrollbar-width: thin;
            scrollbar-color: #9aa3ad transparent;
        }
        .timeline::-webkit-scrollbar { height: 6px; }
        .timeline::-webkit-scrollbar-thumb { background: #9aa3ad; border-radius: 10px; }
        .hour-slot {
            min-width: 56px;
            flex-shrink: 0;
            text-align: center;
            opacity: 0.72;
            padding: 4px 2px 8px;
        }
        .hour-slot.current {
            opacity: 1;
            border-bottom: 2px solid #e8b86d;
        }
        .hour-slot .time {
            font-size: 12px;
            color: #9aa3ad;
            display: block;
        }
        .hour-slot .weather-icon {
            font-size: 1.35rem;
            margin: 6px 0;
            display: block;
            color: #e8b86d;
        }
        .hour-slot .temp {
            font-size: 14px;
            font-weight: 500;
            display: block;
        }
        .rain-chance {
            color: #7eb8d4;
            font-size: 11px;
            margin-top: 4px;
        }
        .hour-slot .details {
            font-size: 11px;
            color: #9aa3ad;
            margin-top: 6px;
            line-height: 1.4;
        }
        .hour-slot .details i { font-size: 0.8rem; }
        .news-col h2 {
            margin: 0;
            font-size: 1.25rem;
            font-weight: 500;
        }
        .kicker {
            margin: 4px 0 8px;
            font-size: 13px;
            color: #9aa3ad;
        }
        .news-subheading {
            margin: 22px 0 8px;
            font-size: 1.05rem;
            font-weight: 500;
        }
        .hecho {
            padding: 18px 0;
            border-top: 1px solid #f3f1ea22;
        }
        .hecho:first-child { border-top: none; padding-top: 0; }
        .hecho h3 {
            margin: 0 0 10px;
            font-size: 1.05rem;
            font-weight: 500;
            line-height: 1.35;
        }
        .hecho p {
            margin: 0 0 8px;
            font-size: 0.92rem;
            line-height: 1.5;
            color: #f3f1ea;
        }
        .hecho p:last-of-type { margin-bottom: 12px; }
        .fuentes {
            font-size: 12px;
            line-height: 1.5;
        }
        .fuentes a {
            color: #8ec8e8;
            text-decoration: none;
            background: none;
            border: none;
            border-radius: 0;
            padding: 0;
        }
        .fuentes a + a::before {
            content: " · ";
            color: #9aa3ad;
        }
        #loader { color: #9aa3ad; }
    </style>
</head>
<body>
<div class="page">
    <header class="masthead">
        <div class="masthead-left">
            <h1>Alfonso</h1>
            <p class="place">San Antonio de Belén</p>
        </div>
        <div class="masthead-right">
            <div id="fecha-cr"></div>
            <div id="hora-cr"></div>
        </div>
    </header>
    <div class="ahora">
        <div class="fx-panel">
            <div class="monex" id="monex">
                <div class="eyebrow">USD/CRC</div>
                <div class="rate" id="monex-rate">…</div>
                <div class="rate-caption">Promedio ponderado · MONEX</div>
                <div class="bac-rates">
                    <div><span>Compra BAC</span><strong id="bac-compra">—</strong></div>
                    <div><span>Venta BAC</span><strong id="bac-venta">—</strong></div>
                </div>
                <div class="bac-note">Ventanilla <a id="bac-fuente" href="https://gee.bccr.fi.cr/IndicadoresEconomicos/Cuadros/frmConsultaTCVentanilla.aspx" target="_blank" rel="noopener">BAC San José</a></div>
                <div class="session" id="monex-session"></div>
                <div class="fuente">Fuente MONEX: <a id="monex-fuente" href="https://gee.bccr.fi.cr/indicadoreseconomicos/Cuadros/frmVerCatCuadro.aspx?CodCuadro=770&idioma=1" target="_blank" rel="noopener">BCCR / MONEX</a></div>
            </div>
        </div>
        <div class="weather">
            <h2 class="weather-title">Belén · 24 h</h2>
            <div id="loader">Cargando pronóstico...</div>
            <div id="forecast" class="timeline"></div>
        </div>
    </div>
    <div class="news-row">
        <section class="news-col">
            <h2>Ignacio Santos</h2>
            <p class="kicker">Costa Rica</p>
            <div id="noticias"></div>
        </section>
        <section class="news-col">
            <h2>Leo Laporte</h2>
            <p class="kicker">Inteligencia artificial</p>
            <div id="leo-hechos"></div>
            <h3 class="news-subheading">Columnas / análisis</h3>
            <div id="leo-columnas"></div>
        </section>
    </div>
</div>
<script>
    // Icono alineado con el % de lluvia que se muestra (precipitation_probability).
    // Tormenta y niebla siguen el weather_code; el resto no pone lluvia si el % es bajo.
    function getWeatherIcon(code, rain) {
        if (code >= 95 && code <= 99) return 'bi-cloud-lightning-rain';
        if (code >= 45 && code <= 48 && rain < 40) return 'bi-cloud-fog';
        if (rain >= 60) return 'bi-cloud-rain-heavy';
        if (rain >= 40) return 'bi-cloud-rain';
        if (rain >= 20) return 'bi-cloud-drizzle';
        if (code === 0) return 'bi-sun';
        if (code >= 1 && code <= 3) return 'bi-cloud-sun';
        return 'bi-cloud';
    }
    function colon(n) {
        return '₡' + Number(n).toFixed(2).replace('.', ',');
    }
    function updateClock() {
        const now = new Date();
        const opts = { timeZone: 'America/Costa_Rica' };
        document.getElementById('fecha-cr').textContent = now.toLocaleDateString('es-CR', Object.assign({
            weekday: 'long',
            day: 'numeric',
            month: 'long',
            year: 'numeric'
        }, opts)).replace(',', '');
        document.getElementById('hora-cr').textContent = now.toLocaleTimeString('es-CR', Object.assign({
            hour: '2-digit',
            minute: '2-digit',
            hour12: false
        }, opts));
    }
    async function fetchWeather() {
        const lat = 9.9781;
        const lon = -84.1879;
        const url = 'https://api.open-meteo.com/v1/forecast?latitude=' + lat + '&longitude=' + lon + '&hourly=temperature_2m,relative_humidity_2m,precipitation_probability,weather_code,wind_speed_10m&timezone=America%2FCosta_Rica&forecast_days=2';
        try {
            const response = await fetch(url);
            const data = await response.json();
            renderForecast(data.hourly);
        } catch (error) {
            document.getElementById('loader').innerText = 'Error al obtener datos.';
        }
    }
    function renderForecast(hourly) {
        const container = document.getElementById('forecast');
        const loader = document.getElementById('loader');
        loader.style.display = 'none';
        const now = new Date();
        const startIndex = hourly.time.findIndex(t => new Date(t) >= now);
        for (let i = startIndex; i < startIndex + 24; i++) {
            const date = new Date(hourly.time[i]);
            const hourLabel = date.getHours() + ':00';
            const temp = Math.round(hourly.temperature_2m[i]);
            const hum = hourly.relative_humidity_2m[i];
            const rain = hourly.precipitation_probability[i];
            const wind = hourly.wind_speed_10m[i];
            const code = hourly.weather_code[i];
            const isCurrent = (i === startIndex);
            const slot = document.createElement('div');
            slot.className = isCurrent ? 'hour-slot current' : 'hour-slot';
            let html = '<span class="time">' + hourLabel + '</span>' +
                '<i class="bi ' + getWeatherIcon(code, rain) + ' weather-icon"></i>' +
                '<span class="temp">' + temp + '°C</span>';
            if (rain >= 40) {
                html += '<div class="rain-chance">' + rain + '%</div>';
            }
            if (isCurrent) {
                html += '<div class="details">' +
                    '<div class="humidity">Humedad ' + hum + '%</div>' +
                    '<div><i class="bi bi-wind"></i> ' + wind + 'km/h</div>' +
                    '</div>';
            }
            slot.innerHTML = html;
            container.appendChild(slot);
        }
    }
    async function fetchMonex() {
        try {
            const res = await fetch('./monex.json', { cache: 'no-store' });
            if (!res.ok) throw new Error('monex.json');
            const d = await res.json();
            document.getElementById('monex-rate').textContent = colon(d.promedioPonderado);
            document.getElementById('monex-session').textContent = 'Sesión MONEX ' + (d.fechaTexto || d.fecha);
            if (d.fuenteUrl) document.getElementById('monex-fuente').href = d.fuenteUrl;
        } catch (e) {
            document.getElementById('monex-rate').textContent = 'No disponible';
            document.getElementById('monex-session').textContent = 'No se pudo leer el dato oficial';
        }
    }
    async function fetchBac() {
        try {
            const res = await fetch('./bac.json', { cache: 'no-store' });
            if (!res.ok) throw new Error('bac.json');
            const d = await res.json();
            document.getElementById('bac-compra').textContent = colon(d.compra);
            document.getElementById('bac-venta').textContent = colon(d.venta);
            if (d.fuenteUrl) document.getElementById('bac-fuente').href = d.fuenteUrl;
        } catch (e) {
            document.getElementById('bac-compra').textContent = '—';
            document.getElementById('bac-venta').textContent = '—';
        }
    }
    function escapeHtml(s) {
        return String(s)
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;')
            .replace(/'/g, '&#39;');
    }
    function renderHechos(container, items) {
        container.replaceChildren();
        (items || []).forEach(function (hecho) {
            const article = document.createElement('article');
            article.className = 'hecho';
            let html = '<h3>' + escapeHtml(hecho.titulo) + '</h3>';
            const paras = (hecho.resumen || []).slice(0, 2);
            paras.forEach(function (p) {
                html += '<p>' + escapeHtml(p) + '</p>';
            });
            if (hecho.fuentes && hecho.fuentes.length) {
                html += '<div class="fuentes">';
                hecho.fuentes.forEach(function (f) {
                    html += '<a href="' + escapeHtml(f.url) + '" target="_blank" rel="noopener">' + escapeHtml(f.medio) + '</a>';
                });
                html += '</div>';
            }
            article.innerHTML = html;
            container.appendChild(article);
        });
    }
    async function fetchNoticias() {
        try {
            const res = await fetch('./noticias.json', { cache: 'no-store' });
            if (!res.ok) throw new Error('noticias.json');
            const d = await res.json();
            renderHechos(document.getElementById('noticias'), d.hechos);
        } catch (e) {
            document.getElementById('noticias').textContent = 'No se pudieron cargar las noticias.';
        }
    }
    async function fetchLeo() {
        try {
            const res = await fetch('./leo.json', { cache: 'no-store' });
            if (!res.ok) throw new Error('leo.json');
            const d = await res.json();
            renderHechos(document.getElementById('leo-hechos'), d.hechos);
            renderHechos(document.getElementById('leo-columnas'), d.columnas);
        } catch (e) {
            document.getElementById('leo-hechos').textContent = 'No se pudieron cargar las noticias.';
        }
    }
    updateClock();
    setInterval(updateClock, 15000);
    fetchWeather();
    fetchMonex();
    fetchBac();
    fetchNoticias();
    fetchLeo();
</script>
</body>
</html>
